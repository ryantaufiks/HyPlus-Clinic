name: aivin

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: aivin-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - media:/app/media  # profile photos
    depends_on:
      db:
        condition: service_healthy
    # Bound to localhost only: public traffic arrives through Cloudflare Tunnel.
    ports:
      - "127.0.0.1:${AIVIN_PORT:-8010}:8000"

  # Reads OMRON devices on the host's Bluetooth adapter through BlueZ (D-Bus).
  gateway:
    build: ./gateway
    image: aivin-gateway:latest
    restart: unless-stopped
    environment:
      AIVIN_URL: http://web:8000
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      TZ: ${TIME_ZONE:-Asia/Jakarta}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - gateway_data:/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  gateway_data:
  media:
