{% extends 'kiosk/base.html' %}
{% load static %}

{% block title %}Hy+ Clinic — Check-in{% endblock %}

{% block extra_css %}
<style>
    body { touch-action: manipulation; }
    .print-only { display: none; }
    .doctor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0.9rem; width: 100%; }
    .doctor-option { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; padding: 1.2rem 1rem; border-radius: 18px; border: 2px solid var(--aivin-border); background: var(--aivin-surface); color: var(--aivin-ink); text-align: center; transition: border-color 0.15s, background 0.15s; }
    .doctor-option:hover, .doctor-option:focus-visible { border-color: var(--aivin-primary); background: var(--aivin-primary-soft); }
    .doctor-option .name { font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
    .doctor-option .room { color: var(--aivin-ink-2); font-weight: 600; }
    .doctor-option .wait { color: var(--aivin-muted); font-size: 0.9rem; }
    .doctor-option.any .avatar-initials { --avatar-bg: var(--aivin-primary); font-size: 2rem; }
    /* Printed ticket: 80 mm receipt printer. */
    @media print {
        @page { size: 80mm auto; margin: 4mm; }
        .stepper, .kiosk-actions, .kiosk-icon, .kiosk-lead, #toast, .no-print-ticket { display: none !important; }
        .kiosk-shell { max-width: none; }
        .kiosk-card { min-height: 0; padding: 0; border: 0; gap: 2mm; }
        .result-grid { gap: 2mm; }
        .result-tile { min-width: 0; padding: 2mm 3mm; }
        .result-value { font-size: 20pt; }
        .qr-box img { width: 42mm; height: 42mm; }
        .print-only { display: block; font-size: 9pt; text-align: center; }
    }
</style>
{% endblock %}

{% block content %}
<div class="kiosk-shell">
    <ol class="stepper" id="stepper" aria-label="Check-in progress">
        <li data-step="0"><span class="num">1</span><span class="label">Welcome</span></li>
        <li data-step="1"><span class="num">2</span><span class="label">About you</span></li>
        <li data-step="2"><span class="num">3</span><span class="label">Weight</span></li>
        <li data-step="3"><span class="num">4</span><span class="label">Blood pressure</span></li>
        <li data-step="4"><span class="num">5</span><span class="label">Done</span></li>
    </ol>
    <section class="surface kiosk-card" id="stage" aria-live="polite"></section>
</div>
<div id="toast" class="alert kiosk-toast d-none" role="alert"></div>
{% endblock %}

{% block extra_js %}
<script>
const SIMULATION_ENABLED = {{ simulation_enabled|yesno:"true,false" }};
const IDLE_RESET_MS = 90000; // back to Welcome after the ticket is shown

const state = {
    step: 0,
    mode: "new",            // "new" | "returning" | "online" (ticket taken on the website)
    patientId: "",          // returning: entered ID; after start: the visit's patient ID
    maskedName: "",         // returning: name shown for confirmation
    confirmed: false,       // returning: the patient confirmed the masked name
    name: "",
    reason: "",
    visitToken: null,
    weight: null,           // { kg, at }
    bp: null,               // { systolic, diastolic, pulse, at }
    ticket: null,           // { queue_number, patient_id, qr_code_image }
    doctors: null,          // on-duty doctors to choose from, while choosing
    anyWaiting: 0,
    doctorId: null,         // null: not chosen yet; "": first available doctor
    doctorName: "",
    busy: false,
    listeningFor: null,     // "name" | "reason"
};
const stage = document.getElementById("stage");
let resetTimer = null;

/* ---------- helpers ---------- */

function toast(text, level = "danger") {
    const el = document.getElementById("toast");
    el.className = `alert alert-${level} kiosk-toast`;
    el.textContent = text;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.add("d-none"), 5000);
}

async function postJson(url, body) {
    const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCsrfToken() },
        body: JSON.stringify(body),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw Object.assign(new Error(data.error || `HTTP ${response.status}`), { status: response.status });
    return data;
}

/* ---------- voice ---------- */

const Voice = {
    recognition: null,
    init() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;
        this.recognition = new SR();
        this.recognition.lang = "en-US";
        this.recognition.interimResults = false;
        this.recognition.maxAlternatives = 1;
        this.recognition.onresult = (event) => onSpeech(event.results[0][0].transcript.trim());
        this.recognition.onerror = (event) => {
            if (event.error === "not-allowed" || event.error === "service-not-allowed") {
                // No microphone permission: fall back to typing for the rest of the session.
                this.recognition = null;
                state.listeningFor = null;
                document.querySelectorAll("[data-mic]").forEach((btn) => btn.remove());
                toast("Voice input is not available here. Please type your answers.", "warning");
            } else if (event.error !== "no-speech" && event.error !== "aborted") {
                toast(`Voice input: ${event.error}. You can type instead.`, "warning");
            }
        };
        this.recognition.onend = () => {
            state.listeningFor = null;
            updateMicButtons();
        };
    },
    get available() { return !!this.recognition; },
    listen(field) {
        if (!this.recognition) return;
        try {
            this.recognition.abort();
            state.listeningFor = field;
            this.recognition.start();
            updateMicButtons();
        } catch (e) { /* already listening */ }
    },
    stop() {
        if (this.recognition) this.recognition.abort();
    },
    say(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
    },
};

// "My name is Andrew" -> "Andrew"
const NAME_PREFIX = /^(?:(?:hi|hello)[,.\s]+)?(?:my name is|my name's|i am|i'm|this is|it's|name is|nama saya|saya)\s+/i;

function onSpeech(text) {
    const field = state.listeningFor;
    if (!field || state.step !== 1) return;
    if (field === "name") {
        text = text.replace(NAME_PREFIX, "").replace(/[.!?]+$/, "").trim();
        text = text.replace(/\b\p{L}/gu, (c) => c.toUpperCase());
    }
    const input = document.getElementById(`input-${field}`);
    if (input) input.value = text;
    state[field] = text;
    updateContinue();
    if (field === "name") {
        Voice.say(`Thank you, ${text}. What brings you in today?`);
        setTimeout(() => Voice.listen("reason"), 2500);
    }
}

function updateMicButtons() {
    document.querySelectorAll("[data-mic]").forEach((btn) => {
        const on = state.listeningFor === btn.dataset.mic;
        btn.classList.toggle("listening", on);
        btn.setAttribute("aria-pressed", on);
        btn.title = on ? "Listening…" : "Speak";
    });
}

/* ---------- devices ---------- */

// Reads measurements from the OMRON devices via the server's BLE gateway.
// The kiosk announces which kind it waits for, polls for a reading taken
// after the step started, and claims it for the current patient.
const DeviceReader = {
    timer: null,
    kind: null,
    since: null,
    lastWait: 0,

    start(kind, onReading) {
        this.stop();
        this.kind = kind;
        this.since = new Date().toISOString();
        this.lastWait = 0;
        const tick = async () => {
            if (this.kind !== kind) return;
            try {
                await this.poll(kind, onReading);
            } catch (error) {
                setDeviceStatus("Connection problem, retrying…", true);
            }
            if (this.kind === kind) this.timer = setTimeout(tick, 2000);
        };
        tick();
    },

    stop() {
        if (this.kind) {
            // Tell the gateway to stop polling this device (saves its battery).
            fetch("/api/devices/wait/", {
                method: "POST",
                keepalive: true,
                headers: { "Content-Type": "application/json", "X-CSRFToken": getCsrfToken() },
                body: JSON.stringify({ kind: this.kind, waiting: false }),
            }).catch(() => {});
        }
        this.kind = null;
        clearTimeout(this.timer);
        this.timer = null;
    },

    async poll(kind, onReading) {
        if (Date.now() - this.lastWait > 60000) {
            await postJson("/api/devices/wait/", { kind });
            this.lastWait = Date.now();
        }
        const params = new URLSearchParams({ kind, since: this.since });
        const response = await fetch(`/api/devices/readings/latest/?${params}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!data.reading) {
            setDeviceStatus(
                data.gateway_online ? "Waiting for the device…" : "Device service is offline. Please ask a nurse.",
                !data.gateway_online,
            );
            return;
        }
        let claimed;
        try {
            claimed = await postJson(`/api/devices/readings/${data.reading.id}/claim/`, { visit: state.visitToken });
        } catch (error) {
            return; // taken or expired: keep waiting
        }
        if (this.kind !== kind) return;
        this.stop();
        onReading(claimed.reading);
    },
};

function setDeviceStatus(text, offline) {
    const el = document.getElementById("device-status");
    if (!el) return;
    el.classList.toggle("offline", !!offline);
    el.querySelector("span.text").textContent = text;
}

function onWeight(reading) {
    state.weight = { kg: reading.weight_kg, at: reading.measured_at };
    Voice.say(`Your weight is ${reading.weight_kg} kilograms.`);
    render();
}

function onBloodPressure(reading) {
    state.bp = { systolic: reading.systolic_bp, diastolic: reading.diastolic_bp, pulse: reading.heart_rate_bpm, at: reading.measured_at };
    const pulse = reading.heart_rate_bpm ? ` Your pulse is ${reading.heart_rate_bpm} beats per minute.` : "";
    Voice.say(`Your blood pressure is ${reading.systolic_bp} over ${reading.diastolic_bp}.${pulse}`);
    render();
}

// DEBUG only: the server rejects simulated measurements in production.
async function simulate(kind) {
    DeviceReader.stop();
    const values = kind === "weight"
        ? { weight_kg: Math.round((50 + Math.random() * 40) * 10) / 10 }
        : { systolic_bp: 105 + Math.floor(Math.random() * 40), diastolic_bp: 65 + Math.floor(Math.random() * 25), heart_rate_bpm: 58 + Math.floor(Math.random() * 35) };
    try {
        await postJson(`/api/kiosk/visits/${state.visitToken}/simulated-measurement/`, values);
        const now = new Date().toISOString();
        if (kind === "weight") onWeight({ weight_kg: values.weight_kg, measured_at: now });
        else onBloodPressure({ systolic_bp: values.systolic_bp, diastolic_bp: values.diastolic_bp, heart_rate_bpm: values.heart_rate_bpm, measured_at: now });
    } catch (error) {
        toast(`Simulation failed: ${error.message}`);
    }
}

/* ---------- flow ---------- */

function begin(mode) {
    state.mode = mode;
    go(1);
}

function go(step) {
    state.step = step;
    Voice.stop();
    DeviceReader.stop();
    render();
    if (step === 1 && state.mode === "online") {
        Voice.say("Please enter your queue number and the last four digits of your WhatsApp number.");
    } else if (step === 1 && state.mode === "new") {
        Voice.say("Please tell me your full name.");
        setTimeout(() => Voice.listen("name"), 1800);
    } else if (step === 1) {
        Voice.say("Please type your Patient ID.");
    } else if (step === 2) {
        Voice.say("Please step onto the scale and stand still.");
        if (!state.weight) DeviceReader.start("weight", onWeight);
    } else if (step === 3) {
        Voice.say("Now let's measure your blood pressure. Wrap the cuff around your wrist and press start on the monitor.");
        if (!state.bp) DeviceReader.start("bp", onBloodPressure);
    } else if (step === 4) {
        finish();
    }
}

async function checkInOnline(event) {
    event.preventDefault();
    if (state.busy) return;
    const number = document.getElementById("input-queue-number").value.replace(/\s+/g, "").toUpperCase();
    const last4 = document.getElementById("input-last4").value.replace(/\D/g, "");
    if (!number || last4.length !== 4) {
        toast("Enter your queue number and the last 4 digits of your WhatsApp number.", "warning");
        return;
    }
    state.busy = true;
    try {
        const visit = await postJson("{% url 'kiosk:api-online-checkin' %}", { queue_number: number, phone_last4: last4 });
        state.visitToken = visit.token;
        state.patientId = visit.patient_id;
        state.name = visit.first_name;
        Voice.say(`Welcome, ${visit.first_name}. You are checked in. Let's measure your vital signs.`);
        go(2);
    } catch (error) {
        toast(error.message, "warning");
    } finally {
        state.busy = false;
    }
}

async function lookupPatient(event) {
    event.preventDefault();
    const id = document.getElementById("input-patient-id").value.replace(/\s+/g, "").toUpperCase();
    if (id.length !== 5) {
        toast("A Patient ID has 5 letters and digits.", "warning");
        return;
    }
    state.busy = true;
    try {
        const found = await postJson("/api/kiosk/lookup/", { patient_id: id });
        state.patientId = found.patient_id;
        state.maskedName = found.masked_name;
        render();
        Voice.say("Is this you?");
    } catch (error) {
        toast(error.message, "warning");
    } finally {
        state.busy = false;
    }
}

function confirmPatient(yes) {
    if (!yes) {
        Object.assign(state, { patientId: "", maskedName: "", confirmed: false });
        render();
        return;
    }
    state.confirmed = true;
    render();
    Voice.say("Welcome back. What brings you in today?");
    setTimeout(() => Voice.listen("reason"), 2200);
}

async function startVisit(event) {
    event.preventDefault();
    if (state.busy) return;
    const nameInput = document.getElementById("input-name");
    if (nameInput) state.name = nameInput.value.trim();
    state.reason = document.getElementById("input-reason").value.trim();
    if ((state.mode === "new" && state.name.length < 2) || state.reason.length < 3) {
        toast("Please fill in both fields.", "warning");
        return;
    }
    await chooseDoctor();
}

// Show the doctors on duty; with nobody to choose from, go on with the first available doctor.
async function chooseDoctor() {
    state.busy = true;
    updateContinue();
    try {
        const response = await fetch("{% url 'kiosk:api-doctors' %}", { cache: "no-store" });
        const data = await response.json();
        state.doctors = data.doctors;
        state.anyWaiting = data.any_waiting;
    } catch (e) {
        state.doctors = [];
    } finally {
        state.busy = false;
    }
    if (!state.doctors.length) {
        pickDoctor("");
        return;
    }
    Voice.stop();
    render();
    Voice.say("Which doctor would you like to see?");
}

function pickDoctor(id) {
    const doctor = (state.doctors || []).find((d) => String(d.id) === String(id));
    state.doctorId = doctor ? String(doctor.id) : "";
    state.doctorName = doctor ? doctor.name : "";
    submitVisit();
}

function backToDetails() {
    state.doctors = null;
    state.doctorId = null;
    render();
}

async function submitVisit() {
    if (state.busy) return;
    state.busy = true;
    try {
        const body = state.mode === "new"
            ? { name: state.name, reason: state.reason, doctor_id: state.doctorId }
            : { patient_id: state.patientId, reason: state.reason, doctor_id: state.doctorId };
        let visit;
        try {
            visit = await postJson("/api/kiosk/visits/", body);
        } catch (error) {
            if (error.status === 409) {  // the doctor went off duty meanwhile
                state.busy = false;
                toast(error.message, "warning");
                await chooseDoctor();
                return;
            }
            throw error;
        }
        state.doctors = null;
        state.visitToken = visit.token;
        state.patientId = visit.patient_id;
        if (!state.name) state.name = visit.first_name;
        go(2);
    } catch (error) {
        toast(`Could not save your details: ${error.message}`);
    } finally {
        state.busy = false;
        updateContinue();
    }
}

async function finish() {
    try {
        state.ticket = await postJson(`/api/kiosk/visits/${state.visitToken}/finish/`, {});
        Voice.say(`All done. Your queue number is ${state.ticket.queue_number}. Please take a photo of this screen, then have a seat.`);
    } catch (error) {
        toast(`Could not create your ticket: ${error.message}. Please ask a nurse.`);
    }
    render();
    clearTimeout(resetTimer);
    resetTimer = setTimeout(reset, IDLE_RESET_MS);
}

function reset() {
    clearTimeout(resetTimer);
    Object.assign(state, {
        mode: "new", patientId: "", maskedName: "", confirmed: false, name: "", reason: "",
        visitToken: null, weight: null, bp: null, ticket: null, busy: false, listeningFor: null,
        doctors: null, anyWaiting: 0, doctorId: null, doctorName: "",
    });
    go(0);
}

function updateContinue() {
    const btn = document.getElementById("continue-btn");
    if (!btn) return;
    const name = document.getElementById("input-name");
    const reasonInput = document.getElementById("input-reason");
    if (!reasonInput) return;
    const reason = reasonInput.value.trim();
    btn.disabled = state.busy || (name && name.value.trim().length < 2) || reason.length < 3;
}

/* ---------- views ---------- */

const resultTile = (label, value, unit, at) => `
    <div class="result-tile">
        <div class="result-label">${esc(label)}</div>
        <div class="result-value">${esc(value)}<span class="result-unit">${esc(unit)}</span></div>
        ${at ? `<div class="result-time">${esc(formatTime(at))}</div>` : ""}
    </div>`;

const waiting = (text) => `
    <div class="device-wait" id="device-status">
        <span class="spinner-grow" aria-hidden="true"></span><span class="text">${esc(text)}</span>
    </div>`;

const simulateButton = (kind) => SIMULATION_ENABLED
    ? `<button class="btn btn-light" onclick="simulate('${kind}')"><i class="bi bi-cpu"></i> Simulate (testing)</button>`
    : "";

const mic = (field, label) => Voice.available
    ? `<button type="button" class="btn btn-light btn-mic" data-mic="${field}" onclick="Voice.listen('${field}')" aria-label="${label}"><i class="bi bi-mic-fill"></i></button>`
    : "";

const reasonField = () => `
    <div>
        <label for="input-reason">What brings you in today?</label>
        <div class="kiosk-input-row">
            <textarea class="form-control form-control-xl" id="input-reason" rows="2" oninput="updateContinue()" required>${esc(state.reason)}</textarea>
            ${mic("reason", "Speak your reason for visiting")}
        </div>
    </div>`;

const formActions = () => `
    <div class="kiosk-actions justify-content-between">
        <button type="button" class="btn btn-light btn-xl" onclick="reset()">Cancel</button>
        <button type="submit" class="btn btn-primary btn-xl btn-icon" id="continue-btn" disabled>Continue <i class="bi bi-arrow-right"></i></button>
    </div>`;

function returningView() {
    if (!state.maskedName) {
        return `
        <span class="kiosk-icon"><i class="bi bi-person-badge"></i></span>
        <h2 class="kiosk-title">Welcome back</h2>
        <p class="kiosk-lead">Enter the 5-character Patient ID from your last visit.</p>
        <form class="kiosk-field d-flex flex-column gap-3" onsubmit="lookupPatient(event)" novalidate>
            <input class="form-control form-control-xl text-center fw-bold" id="input-patient-id" aria-label="Patient ID" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" style="letter-spacing: 0.4em; font-size: 2rem; text-transform: uppercase" required />
            <div class="kiosk-actions justify-content-between">
                <button type="button" class="btn btn-light btn-xl" onclick="reset()">Back</button>
                <button type="submit" class="btn btn-primary btn-xl btn-icon">Find <i class="bi bi-search"></i></button>
            </div>
        </form>
        <p class="kiosk-hint mb-0">Don't have it? Go back and choose <strong>First visit</strong>; a nurse can link your records.</p>`;
    }
    if (!state.confirmed) {
        return `
        <span class="kiosk-icon"><i class="bi bi-person-check"></i></span>
        <h2 class="kiosk-title">Is this you?</h2>
        <div class="queue-display" style="font-size: 2.2rem; letter-spacing: 0.06em">${esc(state.maskedName)}</div>
        <p class="kiosk-lead">Patient ID ${esc(state.patientId)}</p>
        <div class="kiosk-actions">
            <button class="btn btn-light btn-xl" onclick="confirmPatient(false)">No</button>
            <button class="btn btn-primary btn-xl btn-icon" onclick="confirmPatient(true)">Yes, that's me <i class="bi bi-arrow-right"></i></button>
        </div>`;
    }
    return `
        <span class="kiosk-icon"><i class="bi bi-chat-left-text"></i></span>
        <h2 class="kiosk-title">Welcome back</h2>
        <p class="kiosk-lead">${Voice.available ? "Type, or tap the microphone and speak." : "Please type your answer."}</p>
        <form class="kiosk-field d-flex flex-column gap-3" onsubmit="startVisit(event)" novalidate>
            ${reasonField()}
            ${formActions()}
        </form>`;
}

const doctorFace = (d) => d.face.photo
    ? `<img class="avatar" src="${esc(d.face.photo)}" alt="" style="--avatar-size: 88px" />`
    : `<span class="avatar avatar-initials" aria-hidden="true" style="--avatar-size: 88px; --avatar-bg: ${esc(d.face.color)}">${esc(d.face.initials)}</span>`;

const waitingText = (n) => n === 0 ? "No one waiting" : `${n} waiting`;

function doctorView() {
    return `
        <span class="kiosk-icon"><i class="bi bi-person-vcard"></i></span>
        <h2 class="kiosk-title">Choose your doctor</h2>
        <p class="kiosk-lead">Your number will be called to the doctor's room.</p>
        <div class="doctor-grid">
            ${state.doctors.map((d) => `
            <button class="doctor-option" onclick="pickDoctor('${esc(d.id)}')" ${state.busy ? "disabled" : ""}>
                ${doctorFace(d)}
                <span class="name">${esc(d.name)}</span>
                <span class="room"><i class="bi bi-door-open"></i> ${esc(d.room)}</span>
                <span class="wait">${waitingText(d.waiting)}</span>
            </button>`).join("")}
            <button class="doctor-option any" onclick="pickDoctor('')" ${state.busy ? "disabled" : ""}>
                <span class="avatar avatar-initials" aria-hidden="true" style="--avatar-size: 88px"><i class="bi bi-lightning-charge-fill"></i></span>
                <span class="name">First available doctor</span>
                <span class="room">Any room</span>
                <span class="wait">Usually the shortest wait</span>
            </button>
        </div>
        <div class="kiosk-actions justify-content-start w-100">
            <button type="button" class="btn btn-light btn-xl" onclick="backToDetails()"><i class="bi bi-arrow-left"></i> Back</button>
        </div>`;
}

function onlineView() {
    return `
        <span class="kiosk-icon"><i class="bi bi-ticket-perforated"></i></span>
        <h2 class="kiosk-title">Check in your online ticket</h2>
        <p class="kiosk-lead">Enter the queue number on your phone and the last 4 digits of your WhatsApp number.</p>
        <form class="kiosk-field d-flex flex-column gap-3" onsubmit="checkInOnline(event)" novalidate>
            <div>
                <label for="input-queue-number">Queue number</label>
                <input class="form-control form-control-xl text-center fw-bold" id="input-queue-number" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="A012" style="letter-spacing: 0.2em; font-size: 2rem; text-transform: uppercase" required />
            </div>
            <div>
                <label for="input-last4">Last 4 digits of your WhatsApp number</label>
                <input class="form-control form-control-xl text-center fw-bold" id="input-last4" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" style="letter-spacing: 0.4em; font-size: 2rem" required />
            </div>
            <div class="kiosk-actions justify-content-between">
                <button type="button" class="btn btn-light btn-xl" onclick="reset()">Back</button>
                <button type="submit" class="btn btn-primary btn-xl btn-icon">Check in <i class="bi bi-arrow-right"></i></button>
            </div>
        </form>`;
}

const views = {
    0: () => `
        <img class="kiosk-logo" src="{% static 'img/hyplus-mark.png' %}" alt="Hy+ Clinic" width="150" height="95" />
        <h1 class="kiosk-title">Welcome</h1>
        <p class="kiosk-lead">Let's check your weight and blood pressure before you see the doctor. It takes about 3 minutes.</p>
        <div class="kiosk-actions">
            <button class="btn btn-primary btn-xl btn-icon" onclick="begin('new')"><i class="bi bi-person-plus"></i> First visit</button>
            <button class="btn btn-outline-primary btn-xl btn-icon" onclick="begin('returning')"><i class="bi bi-person-badge"></i> I have a Patient ID</button>
        </div>
        <button class="btn btn-light btn-lg btn-icon" onclick="begin('online')"><i class="bi bi-ticket-perforated"></i> I took a queue number online</button>
        <p class="kiosk-hint mb-0"><i class="bi bi-shield-lock"></i> Your results are only shared with the clinic's nurses and doctors.</p>`,

    1: () => state.doctors ? doctorView() : state.mode === "online" ? onlineView() : state.mode === "returning" ? returningView() : `
        <span class="kiosk-icon"><i class="bi bi-person"></i></span>
        <h2 class="kiosk-title">About you</h2>
        <p class="kiosk-lead">${Voice.available ? "Type, or tap the microphone and speak." : "Please type your answers."}</p>
        <form class="kiosk-field d-flex flex-column gap-3" onsubmit="startVisit(event)" novalidate>
            <div>
                <label for="input-name">Full name</label>
                <div class="kiosk-input-row">
                    <input class="form-control form-control-xl" id="input-name" autocomplete="off" value="${esc(state.name)}" oninput="updateContinue()" required />
                    ${mic("name", "Speak your name")}
                </div>
            </div>
            ${reasonField()}
            ${formActions()}
        </form>`,

    2: () => `
        <span class="kiosk-icon ${state.weight ? "done" : ""}"><i class="bi ${state.weight ? "bi-check-lg" : "bi-speedometer2"}"></i></span>
        <h2 class="kiosk-title">Weight</h2>
        ${state.weight
            ? `<div class="result-grid">${resultTile("Your weight", state.weight.kg, "kg", state.weight.at)}</div>
               <div class="kiosk-actions"><button class="btn btn-primary btn-xl btn-icon" onclick="go(3)">Next: blood pressure <i class="bi bi-arrow-right"></i></button></div>`
            : `<p class="kiosk-lead">Remove your shoes and heavy items, then step onto the scale and stand still until the number stops changing.</p>
               ${waiting("Waiting for the scale…")}
               <div class="kiosk-actions">${simulateButton("weight")}<button class="btn btn-light" onclick="go(3)">Skip</button></div>`}`,

    3: () => `
        <span class="kiosk-icon ${state.bp ? "done" : ""}"><i class="bi ${state.bp ? "bi-check-lg" : "bi-heart-pulse"}"></i></span>
        <h2 class="kiosk-title">Blood pressure</h2>
        ${state.bp
            ? `<div class="result-grid">
                   ${resultTile("Blood pressure", `${state.bp.systolic}/${state.bp.diastolic}`, "mmHg", state.bp.at)}
                   ${state.bp.pulse ? resultTile("Pulse", state.bp.pulse, "bpm") : ""}
               </div>
               <div class="kiosk-actions"><button class="btn btn-primary btn-xl btn-icon" onclick="go(4)">Finish <i class="bi bi-check-lg"></i></button></div>`
            : `<p class="kiosk-lead">Sit comfortably with your feet flat. Wrap the cuff around your left wrist, hold it at heart level and press <strong>START</strong>. Stay still and quiet until it finishes.</p>
               ${waiting("Waiting for the blood pressure monitor…")}
               <div class="kiosk-actions">${simulateButton("bp")}<button class="btn btn-light" onclick="go(4)">Skip</button></div>`}`,

    4: () => state.ticket
        ? `
        <span class="kiosk-icon done"><i class="bi bi-check-lg"></i></span>
        <h2 class="kiosk-title">You're all set${state.name ? `, ${esc(state.name.split(" ")[0])}` : ""}</h2>
        <div class="result-grid">
            <div class="result-tile"><div class="result-label">Queue number</div><div class="result-value text-primary">${esc(state.ticket.queue_number)}</div></div>
            ${state.ticket.doctor ? `<div class="result-tile"><div class="result-label">Your doctor</div><div class="result-value" style="font-size: 1.4rem">${esc(state.ticket.doctor)}</div><div class="result-time">${esc(state.ticket.room)}</div></div>` : ""}
            <div class="result-tile"><div class="result-label">Your Patient ID</div><div class="result-value" style="letter-spacing: 0.08em">${esc(state.ticket.patient_id)}</div><div class="result-time">Keep it for your next visit</div></div>
        </div>
        ${state.ticket.qr_code_image ? `<div class="qr-box"><img src="${esc(state.ticket.qr_code_image)}" alt="Ticket QR code" /></div>` : ""}
        <p class="kiosk-lead"><strong>Print or take a photo of this ticket.</strong> Scan the code at the consulting-room door when your number is called.${state.ticket.returning ? "" : " Scan it with your phone to see your place in the queue and complete your registration."}</p>
        <div class="print-only">${state.ticket.doctor ? `${esc(state.ticket.doctor)} · ${esc(state.ticket.room)}<br />` : "First available doctor<br />"}${esc(formatDateTime(new Date()))}<br />Scan at the consulting-room door when your number is called.<br />Scan with your phone to follow the queue.</div>
        <div class="kiosk-actions">
            <button class="btn btn-light btn-xl btn-icon" onclick="window.print()"><i class="bi bi-printer"></i> Print ticket</button>
            <button class="btn btn-primary btn-xl" onclick="reset()">Done</button>
        </div>`
        : `<div class="spinner-border text-primary" role="status"></div><p class="kiosk-lead">Preparing your ticket…</p>`,
};

function render() {
    stage.innerHTML = views[state.step]();
    document.querySelectorAll("#stepper li").forEach((li) => {
        const n = Number(li.dataset.step);
        li.classList.toggle("done", n < state.step);
        li.classList.toggle("active", n === state.step);
    });
    if (state.step === 1) {
        updateContinue();
        updateMicButtons();
        const first = stage.querySelector("input, textarea");
        if (first && !Voice.available) first.focus();
    }
}

Voice.init();
render();
</script>
{% endblock %}
