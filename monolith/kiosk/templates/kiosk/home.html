{% extends 'kiosk/base.html' %}

{% block title %}AIVIN — Check-in{% endblock %}

{% block extra_css %}
<style>
    body { touch-action: manipulation; }
</style>
{% endblock %}

{% block content %}
<div class="kiosk-shell">
    <ol class="stepper" id="stepper" aria-label="Check-in progress">
        <li data-step="0"><span class="num">1</span><span class="label">Welcome</span></li>
        <li data-step="1"><span class="num">2</span><span class="label">About you</span></li>
        <li data-step="2"><span class="num">3</span><span class="label">Weight</span></li>
        <li data-step="3"><span class="num">4</span><span class="label">Blood pressure</span></li>
        <li data-step="4"><span class="num">5</span><span class="label">Done</span></li>
    </ol>
    <section class="surface kiosk-card" id="stage" aria-live="polite"></section>
</div>
<div id="toast" class="alert kiosk-toast d-none" role="alert"></div>
{% endblock %}

{% block extra_js %}
<script>
const SIMULATION_ENABLED = {{ simulation_enabled|yesno:"true,false" }};
const IDLE_RESET_MS = 90000; // back to Welcome after the ticket is shown

const state = {
    step: 0,
    patientId: null,
    name: "",
    symptoms: "",
    weight: null,           // { kg, at }
    bp: null,               // { systolic, diastolic, pulse, at }
    ticket: null,           // { queue_number, qr_code_image }
    busy: false,
    listeningFor: null,     // "name" | "symptoms"
};
const stage = document.getElementById("stage");
let resetTimer = null;

/* ---------- helpers ---------- */

function toast(text, level = "danger") {
    const el = document.getElementById("toast");
    el.className = `alert alert-${level} kiosk-toast`;
    el.textContent = text;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.add("d-none"), 5000);
}

async function postJson(url, body) {
    const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-CSRFToken": getCsrfToken() },
        body: JSON.stringify(body),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
}

/* ---------- voice ---------- */

const Voice = {
    recognition: null,
    init() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return;
        this.recognition = new SR();
        this.recognition.lang = "en-US";
        this.recognition.interimResults = false;
        this.recognition.maxAlternatives = 1;
        this.recognition.onresult = (event) => onSpeech(event.results[0][0].transcript.trim());
        this.recognition.onerror = (event) => {
            if (event.error === "not-allowed" || event.error === "service-not-allowed") {
                // No microphone permission: fall back to typing for the rest of the session.
                this.recognition = null;
                state.listeningFor = null;
                document.querySelectorAll("[data-mic]").forEach((btn) => btn.remove());
                toast("Voice input is not available here. Please type your answers.", "warning");
            } else if (event.error !== "no-speech" && event.error !== "aborted") {
                toast(`Voice input: ${event.error}. You can type instead.`, "warning");
            }
        };
        this.recognition.onend = () => {
            state.listeningFor = null;
            updateMicButtons();
        };
    },
    get available() { return !!this.recognition; },
    listen(field) {
        if (!this.recognition) return;
        try {
            this.recognition.abort();
            state.listeningFor = field;
            this.recognition.start();
            updateMicButtons();
        } catch (e) { /* already listening */ }
    },
    stop() {
        if (this.recognition) this.recognition.abort();
    },
    say(text) {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
    },
};

function onSpeech(text) {
    const field = state.listeningFor;
    if (!field || state.step !== 1) return;
    const input = document.getElementById(`input-${field}`);
    if (input) input.value = text;
    state[field] = text;
    updateContinue();
    if (field === "name") {
        Voice.say(`Thank you, ${text}. What brings you in today?`);
        setTimeout(() => Voice.listen("symptoms"), 2500);
    }
}

function updateMicButtons() {
    document.querySelectorAll("[data-mic]").forEach((btn) => {
        const on = state.listeningFor === btn.dataset.mic;
        btn.classList.toggle("listening", on);
        btn.setAttribute("aria-pressed", on);
        btn.title = on ? "Listening…" : "Speak";
    });
}

/* ---------- devices ---------- */

// Reads measurements from the OMRON devices via the server's BLE gateway.
// The kiosk announces which kind it waits for, polls for a reading taken
// after the step started, and claims it for the current patient.
const DeviceReader = {
    timer: null,
    kind: null,
    since: null,
    lastWait: 0,

    start(kind, onReading) {
        this.stop();
        this.kind = kind;
        this.since = new Date().toISOString();
        this.lastWait = 0;
        const tick = async () => {
            if (this.kind !== kind) return;
            try {
                await this.poll(kind, onReading);
            } catch (error) {
                setDeviceStatus("Connection problem, retrying…", true);
            }
            if (this.kind === kind) this.timer = setTimeout(tick, 2000);
        };
        tick();
    },

    stop() {
        if (this.kind) {
            // Tell the gateway to stop polling this device (saves its battery).
            fetch("/api/devices/wait/", {
                method: "POST",
                keepalive: true,
                headers: { "Content-Type": "application/json", "X-CSRFToken": getCsrfToken() },
                body: JSON.stringify({ kind: this.kind, waiting: false }),
            }).catch(() => {});
        }
        this.kind = null;
        clearTimeout(this.timer);
        this.timer = null;
    },

    async poll(kind, onReading) {
        if (Date.now() - this.lastWait > 60000) {
            await postJson("/api/devices/wait/", { kind });
            this.lastWait = Date.now();
        }
        const params = new URLSearchParams({ kind, since: this.since });
        const response = await fetch(`/api/devices/readings/latest/?${params}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!data.reading) {
            setDeviceStatus(
                data.gateway_online ? "Waiting for the device…" : "Device service is offline. Please ask a nurse.",
                !data.gateway_online,
            );
            return;
        }
        let claimed;
        try {
            claimed = await postJson(`/api/devices/readings/${data.reading.id}/claim/`, { patient_id: state.patientId });
        } catch (error) {
            return; // taken or expired: keep waiting
        }
        if (this.kind !== kind) return;
        this.stop();
        onReading(claimed.reading);
    },
};

function setDeviceStatus(text, offline) {
    const el = document.getElementById("device-status");
    if (!el) return;
    el.classList.toggle("offline", !!offline);
    el.querySelector("span.text").textContent = text;
}

function onWeight(reading) {
    state.weight = { kg: reading.weight_kg, at: reading.measured_at };
    Voice.say(`Your weight is ${reading.weight_kg} kilograms.`);
    render();
}

function onBloodPressure(reading) {
    state.bp = { systolic: reading.systolic_bp, diastolic: reading.diastolic_bp, pulse: reading.heart_rate_bpm, at: reading.measured_at };
    const pulse = reading.heart_rate_bpm ? ` Your pulse is ${reading.heart_rate_bpm} beats per minute.` : "";
    Voice.say(`Your blood pressure is ${reading.systolic_bp} over ${reading.diastolic_bp}.${pulse}`);
    render();
}

// DEBUG only: the server rejects simulated measurements in production.
async function simulate(kind) {
    DeviceReader.stop();
    const values = kind === "weight"
        ? { weight_kg: Math.round((50 + Math.random() * 40) * 10) / 10 }
        : { systolic_bp: 105 + Math.floor(Math.random() * 40), diastolic_bp: 65 + Math.floor(Math.random() * 25), heart_rate_bpm: 58 + Math.floor(Math.random() * 35) };
    try {
        await postJson("/api/measurements/", { patient_id: state.patientId, ...values });
        const now = new Date().toISOString();
        if (kind === "weight") onWeight({ weight_kg: values.weight_kg, measured_at: now });
        else onBloodPressure({ systolic_bp: values.systolic_bp, diastolic_bp: values.diastolic_bp, heart_rate_bpm: values.heart_rate_bpm, measured_at: now });
    } catch (error) {
        toast(`Simulation failed: ${error.message}`);
    }
}

/* ---------- flow ---------- */

function go(step) {
    state.step = step;
    Voice.stop();
    DeviceReader.stop();
    render();
    if (step === 1) {
        Voice.say("Please tell me your full name.");
        setTimeout(() => Voice.listen("name"), 1800);
    } else if (step === 2) {
        Voice.say("Please step onto the scale and stand still.");
        if (!state.weight) DeviceReader.start("weight", onWeight);
    } else if (step === 3) {
        Voice.say("Now let's measure your blood pressure. Wrap the cuff around your wrist and press start on the monitor.");
        if (!state.bp) DeviceReader.start("bp", onBloodPressure);
    } else if (step === 4) {
        finish();
    }
}

async function submitPatient(event) {
    event.preventDefault();
    if (state.busy) return;
    state.name = document.getElementById("input-name").value.trim();
    state.symptoms = document.getElementById("input-symptoms").value.trim();
    if (state.name.length < 2 || state.symptoms.length < 3) {
        toast("Please enter your name and the reason for your visit.", "warning");
        return;
    }
    state.busy = true;
    updateContinue();
    try {
        const patient = await postJson("/api/patients/", { name: state.name, symptoms: state.symptoms });
        state.patientId = patient.id;
        go(2);
    } catch (error) {
        toast(`Could not save your details: ${error.message}`);
    } finally {
        state.busy = false;
        updateContinue();
    }
}

async function finish() {
    try {
        state.ticket = await postJson("/api/queue/generate/", { patient_id: state.patientId });
        Voice.say(`All done. Your queue number is ${state.ticket.queue_number}. Please have a seat; the doctor will call you.`);
    } catch (error) {
        toast(`Could not create your ticket: ${error.message}. Please ask a nurse.`);
    }
    render();
    clearTimeout(resetTimer);
    resetTimer = setTimeout(reset, IDLE_RESET_MS);
}

function reset() {
    clearTimeout(resetTimer);
    Object.assign(state, { patientId: null, name: "", symptoms: "", weight: null, bp: null, ticket: null, busy: false, listeningFor: null });
    go(0);
}

function updateContinue() {
    const btn = document.getElementById("continue-btn");
    if (!btn) return;
    const name = document.getElementById("input-name").value.trim();
    const symptoms = document.getElementById("input-symptoms").value.trim();
    btn.disabled = state.busy || name.length < 2 || symptoms.length < 3;
}

/* ---------- views ---------- */

const resultTile = (label, value, unit, at) => `
    <div class="result-tile">
        <div class="result-label">${esc(label)}</div>
        <div class="result-value">${esc(value)}<span class="result-unit">${esc(unit)}</span></div>
        ${at ? `<div class="result-time">${esc(formatTime(at))}</div>` : ""}
    </div>`;

const waiting = (text) => `
    <div class="device-wait" id="device-status">
        <span class="spinner-grow" aria-hidden="true"></span><span class="text">${esc(text)}</span>
    </div>`;

const simulateButton = (kind) => SIMULATION_ENABLED
    ? `<button class="btn btn-light" onclick="simulate('${kind}')"><i class="bi bi-cpu"></i> Simulate (testing)</button>`
    : "";

const views = {
    0: () => `
        <span class="kiosk-icon"><i class="bi bi-heart-pulse-fill"></i></span>
        <h1 class="kiosk-title">Welcome</h1>
        <p class="kiosk-lead">Let's check your weight and blood pressure before you see the doctor. It takes about 3 minutes.</p>
        <div class="kiosk-actions">
            <button class="btn btn-primary btn-xl btn-icon" onclick="go(1)"><i class="bi bi-play-fill"></i> Start check-in</button>
        </div>
        <p class="kiosk-hint mb-0"><i class="bi bi-shield-lock"></i> Your results are only shared with the clinic's nurses and doctors.</p>`,

    1: () => `
        <span class="kiosk-icon"><i class="bi bi-person"></i></span>
        <h2 class="kiosk-title">About you</h2>
        <p class="kiosk-lead">${Voice.available ? "Type, or tap the microphone and speak." : "Please type your answers."}</p>
        <form class="kiosk-field d-flex flex-column gap-3" onsubmit="submitPatient(event)" novalidate>
            <div>
                <label for="input-name">Full name</label>
                <div class="kiosk-input-row">
                    <input class="form-control form-control-xl" id="input-name" autocomplete="off" value="${esc(state.name)}" oninput="updateContinue()" required />
                    ${Voice.available ? `<button type="button" class="btn btn-light btn-mic" data-mic="name" onclick="Voice.listen('name')" aria-label="Speak your name"><i class="bi bi-mic-fill"></i></button>` : ""}
                </div>
            </div>
            <div>
                <label for="input-symptoms">What brings you in today?</label>
                <div class="kiosk-input-row">
                    <textarea class="form-control form-control-xl" id="input-symptoms" rows="2" oninput="updateContinue()" required>${esc(state.symptoms)}</textarea>
                    ${Voice.available ? `<button type="button" class="btn btn-light btn-mic" data-mic="symptoms" onclick="Voice.listen('symptoms')" aria-label="Speak your reason for visiting"><i class="bi bi-mic-fill"></i></button>` : ""}
                </div>
            </div>
            <div class="kiosk-actions justify-content-between">
                <button type="button" class="btn btn-light btn-xl" onclick="reset()">Cancel</button>
                <button type="submit" class="btn btn-primary btn-xl btn-icon" id="continue-btn" disabled>Continue <i class="bi bi-arrow-right"></i></button>
            </div>
        </form>`,

    2: () => `
        <span class="kiosk-icon ${state.weight ? "done" : ""}"><i class="bi ${state.weight ? "bi-check-lg" : "bi-speedometer2"}"></i></span>
        <h2 class="kiosk-title">Weight</h2>
        ${state.weight
            ? `<div class="result-grid">${resultTile("Your weight", state.weight.kg, "kg", state.weight.at)}</div>
               <div class="kiosk-actions"><button class="btn btn-primary btn-xl btn-icon" onclick="go(3)">Next: blood pressure <i class="bi bi-arrow-right"></i></button></div>`
            : `<p class="kiosk-lead">Remove your shoes and heavy items, then step onto the scale and stand still until the number stops changing.</p>
               ${waiting("Waiting for the scale…")}
               <div class="kiosk-actions">${simulateButton("weight")}<button class="btn btn-light" onclick="go(3)">Skip</button></div>`}`,

    3: () => `
        <span class="kiosk-icon ${state.bp ? "done" : ""}"><i class="bi ${state.bp ? "bi-check-lg" : "bi-heart-pulse"}"></i></span>
        <h2 class="kiosk-title">Blood pressure</h2>
        ${state.bp
            ? `<div class="result-grid">
                   ${resultTile("Blood pressure", `${state.bp.systolic}/${state.bp.diastolic}`, "mmHg", state.bp.at)}
                   ${state.bp.pulse ? resultTile("Pulse", state.bp.pulse, "bpm") : ""}
               </div>
               <div class="kiosk-actions"><button class="btn btn-primary btn-xl btn-icon" onclick="go(4)">Finish <i class="bi bi-check-lg"></i></button></div>`
            : `<p class="kiosk-lead">Sit comfortably with your feet flat. Wrap the cuff around your left wrist, hold it at heart level and press <strong>START</strong>. Stay still and quiet until it finishes.</p>
               ${waiting("Waiting for the blood pressure monitor…")}
               <div class="kiosk-actions">${simulateButton("bp")}<button class="btn btn-light" onclick="go(4)">Skip</button></div>`}`,

    4: () => state.ticket
        ? `
        <span class="kiosk-icon done"><i class="bi bi-check-lg"></i></span>
        <h2 class="kiosk-title">You're all set, ${esc(state.name.split(" ")[0])}</h2>
        <div class="text-muted fw-semibold">Your queue number</div>
        <div class="queue-display">${esc(state.ticket.queue_number)}</div>
        ${state.ticket.qr_code_image ? `<div class="qr-box"><img src="${esc(state.ticket.qr_code_image)}" alt="Ticket QR code" /></div>` : ""}
        <p class="kiosk-lead">Please have a seat. Show this code to the doctor when you are called.</p>
        <div class="kiosk-actions"><button class="btn btn-primary btn-xl" onclick="reset()">Done</button></div>`
        : `<div class="spinner-border text-primary" role="status"></div><p class="kiosk-lead">Preparing your ticket…</p>`,
};

function render() {
    stage.innerHTML = views[state.step]();
    document.querySelectorAll("#stepper li").forEach((li) => {
        const n = Number(li.dataset.step);
        li.classList.toggle("done", n < state.step);
        li.classList.toggle("active", n === state.step);
    });
    if (state.step === 1) {
        updateContinue();
        updateMicButtons();
    }
}

Voice.init();
render();
</script>
{% endblock %}
