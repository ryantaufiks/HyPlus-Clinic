{% extends 'kiosk/base.html' %}

{% block title %}Staff login - AIVIN{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card p-4">
                <h1 class="h4 mb-3"><i class="bi bi-person-lock"></i> Staff login</h1>
                <p class="text-muted small">Patient data is only available to nurses, doctors and administrators.</p>
                {% if form.errors %}
                <div class="alert alert-danger" role="alert">Incorrect username or password.</div>
                {% endif %}
                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label class="form-label" for="id_username">Username</label>
                        <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="id_password">Password</label>
                        <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log in</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
